name: tests

on:
  pull_request:
    paths: ["onboard/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["onboard/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        # Oldest supported (requires-python) and the recommended current release.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # Standard library only: nothing to install or cache.
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -t .
