# Governance hooks. Hooks are pinned to commit SHAs; the local ones run the
# managed tools in .governance/tools/. Install with: pre-commit install
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]  # hooks opt in to commit-msg explicitly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pii-scan
        name: pii-scan (block personal data)
        entry: .governance/tools/pii_scan.py
        language: script
        types: [text]

      - id: commit-msg-policy
        name: commit message policy (Conventional Commits, no session links, no PII)
        entry: .governance/tools/check_commit_msg.py
        language: script
        stages: [commit-msg]
